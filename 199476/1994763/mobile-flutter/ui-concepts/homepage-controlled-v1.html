<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>事先问 · 首页视觉母版</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --red: #ee312f;
      --red-dark: #d92725;
      --ink: #17191c;
      --ink-soft: #25282d;
      --paper: #f3f4f6;
      --white: #ffffff;
      --muted: #73777f;
      --line: #e7e8eb;
    }

    body {
      margin: 0;
      background: #dfe1e5;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: grid;
      min-height: 100vh;
      justify-items: start;
      align-items: start;
    }

    .screen {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 932px;
      overflow: hidden;
      background: var(--paper);
    }

    .masthead {
      padding: 22px 20px 20px;
      background: var(--ink);
      color: var(--white);
    }

    .topbar {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #474b51;
    }

    .search {
      height: 42px;
      border-radius: 14px;
      background: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      color: #b7bac0;
      font-size: 14px;
    }

    .search svg,
    .bell svg {
      display: block;
    }

    .bell {
      position: relative;
      width: 42px;
      height: 42px;
      border: 0;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: transparent;
    }

    .bell-count {
      position: absolute;
      top: 0;
      right: -2px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 750;
      line-height: 20px;
      text-align: center;
    }

    .brand-row {
      margin-top: 26px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .brand-name {
      font-size: 29px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .brand-name i {
      color: var(--red);
      font-style: normal;
    }

    .brand-copy {
      margin-top: 5px;
      color: #aeb1b7;
      font-size: 13px;
    }

    .brand-mark {
      width: 72px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }

    .brand-mark span {
      display: block;
      width: 10px;
      background: #3a3d43;
      border-radius: 5px;
    }

    .brand-mark span:nth-child(1) { height: 14px; }
    .brand-mark span:nth-child(2) { height: 25px; background: var(--red); }
    .brand-mark span:nth-child(3) { height: 34px; }
    .brand-mark span:nth-child(4) { height: 20px; }

    .discovery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 22px;
      overflow: hidden;
      border-radius: 18px;
    }

    .discovery-item {
      min-height: 106px;
      padding: 18px;
      color: var(--white);
      background: var(--red);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .discovery-item.secondary {
      background: var(--white);
      color: var(--ink);
    }

    .discovery-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
    }

    .discovery-copy {
      color: rgba(255, 255, 255, 0.76);
      font-size: 12px;
    }

    .secondary .discovery-copy {
      color: var(--muted);
    }

    main {
      padding: 24px 16px 100px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 4px 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .people {
      display: grid;
      gap: 12px;
    }

    .person {
      overflow: hidden;
      border-radius: 18px;
      background: var(--white);
    }

    .person-main {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      gap: 13px;
      align-items: center;
      padding: 16px;
    }

    .person-photo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      object-fit: cover;
      background: #e4e5e7;
    }

    .job {
      font-size: 18px;
      font-weight: 820;
      line-height: 1.2;
    }

    .meta {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .verified {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #fff0ef;
      color: var(--red);
      font-size: 13px;
      font-weight: 900;
    }

    .experience {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 18px;
      gap: 10px;
      align-items: center;
      padding: 13px 16px;
      background: #e9eaed;
    }

    .experience-label {
      color: var(--red-dark);
      font-size: 12px;
      font-weight: 800;
    }

    .experience-text {
      color: #44484f;
      font-size: 13px;
      line-height: 1.45;
    }

    .chevron {
      color: #8b8e94;
      font-size: 20px;
    }

    nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 78px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      background: rgba(255, 255, 255, 0.98);
    }

    .nav-item {
      display: grid;
      justify-items: center;
      gap: 5px;
      color: #70747b;
      font-size: 11px;
    }

    .nav-item.active {
      color: var(--red);
      font-weight: 750;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="masthead">
      <div class="topbar">
        <img class="avatar" src="../assets/images/default-avatar.png" alt="头像" onerror="this.src='../../public/images/avatar1.jpg'" />
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <span>搜索主职</span>
        </div>
        <button class="bell" aria-label="消息">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          <span class="bell-count">12</span>
        </button>
      </div>

      <div class="brand-row">
        <div>
          <div class="brand-name">事先<i>问</i></div>
          <div class="brand-copy">有事先问问过来人</div>
        </div>
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="discovery">
        <div class="discovery-item">
          <div class="discovery-title"><span>按事情</span><span>→</span></div>
          <div class="discovery-copy">按具体事情找人</div>
        </div>
        <div class="discovery-item secondary">
          <div class="discovery-title"><span>按经历</span><span>→</span></div>
          <div class="discovery-copy">按亲身经历找人</div>
        </div>
      </div>
    </header>

    <main>
      <div class="section-head">
        <h2>可以帮你的人</h2>
        <span>基础信息已核验</span>
      </div>

      <div class="people">
        <article class="person">
          <div class="person-main">
            <img class="person-photo" src="../../public/images/avatar1.jpg" alt="" />
            <div><div class="job">产品经理</div><div class="meta">8年经验 · UID 238749</div></div>
            <div class="verified">✓</div>
          </div>
          <div class="experience">
            <div class="experience-label">亲身经历</div>
            <div class="experience-text">从零搭建产品，并完成第一次商业化</div>
            <div class="chevron">›</div>
          </div>
        </article>

        <article class="person">
          <div class="person-main">
            <img class="person-photo" src="../../public/images/avatar2.jpg" alt="" />
            <div><div class="job">注册营养师</div><div class="meta">5年经验 · UID 176582</div></div>
            <div class="verified">✓</div>
          </div>
          <div class="experience">
            <div class="experience-label">亲身经历</div>
            <div class="experience-text">三甲医院营养科工作经历</div>
            <div class="chevron">›</div>
          </div>
        </article>

        <article class="person">
          <div class="person-main">
            <img class="person-photo" src="../../public/images/avatar3.png" alt="" />
            <div><div class="job">水暖工</div><div class="meta">12年经验 · UID 112933</div></div>
            <div class="verified">✓</div>
          </div>
          <div class="experience">
            <div class="experience-label">亲身经历</div>
            <div class="experience-text">老房水路改造与漏水排查</div>
            <div class="chevron">›</div>
          </div>
        </article>
      </div>
    </main>

    <nav>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg>
        <span>首页</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
        <span>我的询问</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>我的</span>
      </div>
    </nav>
  </div>
</body>
</html>
